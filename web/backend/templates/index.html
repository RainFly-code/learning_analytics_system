<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多维学情剖析系统数据面板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0b1220; --panel:#0f1a2e; --card:#111b33; --border:#1b2a4a; --muted:#9fb2d9; --primary:#1f6feb; --success:#22c55e; --warning:#f59e0b;
      --video-h: 420px;
    }
    * { box-sizing:border-box; }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial; background:var(--bg); color:#e8eef9; margin:0; }
    header { background:var(--panel); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; justify-content:center; }
    header h1 { font-size:20px; letter-spacing:1px; margin:0; }
    .wrap { padding:12px 16px; display:grid; grid-template-columns: 280px 1fr 320px; gap:10px; align-items:stretch; }
    .col { display:flex; flex-direction:column; gap:10px; height:100%; }
    .col-top { height: var(--video-h); display:grid; grid-template-rows: 1fr 1fr; gap:10px; overflow:hidden; }
    .push-bottom { margin-top:auto; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; }
    .title { font-size:14px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; }
    .stat-row { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:10px; }
    .stat { background:#0c1528; border:1px solid var(--border); border-radius:8px; padding:10px; }
    .stat .val { font-size:20px; font-weight:700; }
    .video { position:relative; }
    .video video { width:100%; height: var(--video-h); border-radius:8px; border:1px solid var(--border); object-fit: contain; aspect-ratio: 16 / 9; background:#0c1528; display:block; }
    .video .overlay { position:absolute; left:12px; top:12px; background:#0c1528cc; border:1px dashed #294064; padding:8px; border-radius:8px; font-size:12px; }
    .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .grid-3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
    .line { height:200px; background:var(--card); border:1px solid var(--border); border-radius:8px; position:relative; overflow:hidden; }
    .line > div, .line canvas { position:absolute; inset:0; }
    .pie { height:240px; display:flex; align-items:center; justify-content:center; position:relative; }
    .pie > div, .pie canvas { position:absolute; inset:0; }
    .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; color:var(--muted); font-size:12px; }
    .legend-item { display:flex; align-items:center; gap:6px; }
    .legend-swatch { width:10px; height:10px; border-radius:2px; border:1px solid var(--border); }
    .gauge { height:200px; display:flex; align-items:center; justify-content:center; }
    .overview-metrics { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-top:8px; }
    .overview-metrics .stat .val { font-size:18px; }
    .bar-dist { height:220px; display:block; position:relative; }
    .bar-dist div { background:#334155; border:1px solid var(--border); border-radius:4px; display:flex; align-items:flex-end; justify-content:center; color:#9fb2d9; font-size:10px; }
    /* 顶部容器两张卡片各占一行，图表填满卡片 */
    .col-top .card { display:flex; flex-direction:column; }
    .col-top .line { height:100%; }
    .col-top .pie { height:100%; }
    .bar { height:80px; display:flex; align-items:flex-end; gap:6px; }
    .bar div { width:14%; background:#334155; border:1px solid var(--border); border-radius:4px; }
    /* 左侧底部柱状图加高，便于与中间底部区域对齐 */
    #barLeft { height:140px; }
    /* 右侧底部线图容器加高，便于与中间底部区域对齐 */
    #lineRight2Wrap { height:200px; }
    .footer { margin-top:10px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { border-bottom:1px solid var(--border); padding:6px; text-align:left; }
    .table-wrap { height:180px; overflow:auto; }
    /* 高度统一：趋势图、纪律饼图、底部三卡片 */
    .col-left .line { height:280px; }
    .col-right .pie { height:280px; }
    .footer .card { height:170px; display:flex; flex-direction:column; }
    .muted { color:var(--muted); }
    .fab { position:fixed; right:20px; bottom:20px; background:var(--primary); color:#fff; border:none; border-radius:999px; padding:12px 16px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(31,111,235,.3); }
    /* Modal 样式统一深色系并增加层次与动效 */
    .modal { position:fixed; inset:0; background:rgba(9,14,25,.55); backdrop-filter: blur(3px); display:none; align-items:center; justify-content:center; }
    .modal .content { width:720px; border-radius:14px; padding:18px; border:1px solid #23375d; box-shadow: 0 12px 32px rgba(0,0,0,.35);
      background: linear-gradient(180deg, #0f1a2e 0%, #0c1528 100%); }
    .modal .title { padding-bottom:8px; border-bottom:1px solid var(--border); }
    .form { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    input[type="text"], textarea, input[type="file"] { width:100%; padding:10px; border-radius:10px; border:1px solid #274166; background:#0c1528; color:#e8eef9; transition:border-color .2s, box-shadow .2s; }
    input[type="text"]::placeholder, textarea::placeholder { color:#7d96c3; }
    input[type="text"]:focus, textarea:focus, input[type="file"]:focus { outline:none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(31,111,235,.25); }
    .btn { background:var(--primary); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; box-shadow:0 6px 16px rgba(31,111,235,.3); }
    .btn:disabled { background:#294064; cursor:not-allowed; box-shadow:none; }
    .btn-sec { background:#26364f; color:#dbe7ff; }
    .progress { height:8px; background:#0c1528; border-radius:6px; overflow:hidden; border:1px solid #294064; }
    .progress > div { height:100%; background:var(--success); width:0%; transition: width 0.3s ease; }
  </style>
</head>
<body>
  <header><h1>学情分析系统数据面板</h1></header>

  <div class="wrap">
    <!-- 左侧列 -->
    <div class="col col-left">
      <div class="card">
        <div class="title">课堂总体概览</div>
        <div class="overview-metrics">
          <div class="stat"><div class="muted">出勤率</div><div id="ovAttendRate" class="val">0%</div></div>
          <div class="stat"><div class="muted">专注度指数</div><div id="ovAttention" class="val">0.0</div></div>
          <div class="stat"><div class="muted">不良行为比例</div><div id="ovBadRatio" class="val">0%</div></div>
          <div class="stat"><div class="muted">举手次数</div><div id="ovRaiseCount" class="val">0</div></div>
        </div>
      </div>
      <div class="card">
        <div class="title">行为分布与统计</div>
        <div class="bar-dist" id="distBars"></div>
      </div>
      <div class="card">
        <div class="title">行为趋势分析</div>
        <div class="line"><div id="stackedArea"></div></div>
      </div>
    </div>

    <!-- 中间列 -->
    <div class="col col-center">
      <div class="card">
        <div class="title">课程信息</div>
        <div class="grid-3">
          <div class="stat"><div class="muted">课程名称</div><div id="infoCourse" class="val">—</div></div>
          <div class="stat"><div class="muted">课程简介</div><div id="infoDesc" class="val">—</div></div>
          <div class="stat"><div class="muted">总人数</div><div id="infoTotal" class="val">0</div></div>
        </div>
      </div>
      <div class="card video">
        <div class="title">课堂监控画面</div>
        <video id="resultVideo" controls></video>
        <div class="overlay">
          <div>课程：<span id="ovCourse">—</span></div>
          <div>教师：<span id="ovTeacher">—</span></div>
          <div>到课：<span id="ovAttend">0</span> 人</div>
          <div>异常：<span id="ovAbn">0</span> 次</div>
        </div>
      </div>
      <div class="grid-3 footer">
        <div class="card">
          <div class="title">未出勤人员 <span id="absentCount" class="muted">0人</span></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>学号</th><th>姓名</th><th>状态</th></tr></thead>
              <tbody id="absentBody"></tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="title">签到表</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>姓名</th><th>状态</th></tr></thead>
              <tbody id="attendanceBody"></tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="title">检测状态信息</div>
          <div id="detectStatus" class="val" style="font-size:18px;">未开始</div>
        </div>
      </div>
    </div>

    <!-- 右侧列：三部分 -->
    <div class="col col-right">
      <div class="card">
        <div class="title">课堂互动分析</div>
        <div class="line"><div id="interactionLine"></div></div>
      </div>
      <div class="card">
        <div class="title">课堂纪律分析</div>
        <div class="pie"><div id="disciplinePie"></div></div>
      </div>
      <div class="card">
        <div class="title">课堂建议</div>
        <ul id="suggestions" class="muted" style="margin:0; padding-left:18px;">
          <li>增加互动环节提升专注度</li>
          <li>对高发不良行为时段进行课堂管理</li>
          <li>优化课堂节奏，减少走神</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 上传浮窗 -->
  <button class="fab" id="fabUpload">上传课程视频</button>
  <div class="modal" id="modalUpload">
    <div class="content">
      <div class="title"><strong>课程信息上传</strong><span id="statusText" class="muted"></span></div>
      <div class="form">
        <div>
          <label class="muted">课程名称</label>
          <input id="courseName" type="text" placeholder="如：高数-第5周" />
        </div>
        <div>
          <label class="muted">课程简介</label>
          <input id="courseDesc" type="text" placeholder="简要描述" />
        </div>
        <div style="grid-column: 1 / span 2;">
          <label class="muted">学生名单（每行一个名字）</label>
          <textarea id="students" rows="5" placeholder="张三\n李四\n..."></textarea>
        </div>
        <div style="grid-column: 1 / span 2;">
          <label class="muted">课程监控视频</label>
          <input id="videoFile" type="file" accept="video/*" />
        </div>
      </div>
      <div style="margin-top:12px; display:flex; gap:10px; align-items:center; justify-content:flex-end;">
        <button id="closeModal" class="btn btn-sec">关闭</button>
        <button id="uploadBtn" class="btn">上传并处理</button>
      </div>
      <div class="progress" style="margin-top:10px;">
        <div id="progressBar"></div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" onerror="(function(){var s=document.createElement('script');s.src='https://unpkg.com/echarts@5/dist/echarts.min.js';document.head.appendChild(s);})();"></script>
  <script>
    // 元素引用
    const resultVideo = document.getElementById('resultVideo');
    const ovCourse = document.getElementById('ovCourse');
    const ovTeacher = document.getElementById('ovTeacher');
    const ovAttend = document.getElementById('ovAttend');
    const ovAbn = document.getElementById('ovAbn');
    const infoCourse = document.getElementById('infoCourse');
    const infoDesc = document.getElementById('infoDesc');
    const infoTotal = document.getElementById('infoTotal');
    const ovAttendRate = document.getElementById('ovAttendRate');
    const ovAttention = document.getElementById('ovAttention');
    const ovBadRatio = document.getElementById('ovBadRatio');
    const ovRaiseCount = document.getElementById('ovRaiseCount');
    const stDown = document.getElementById('stDown');
    const stSleep = document.getElementById('stSleep');
    const stRaise = document.getElementById('stRaise');
    const detectStatusEl = document.getElementById('detectStatus');
    const attendanceBody = document.getElementById('attendanceBody');
    const absentBody = document.getElementById('absentBody');
    const absentCount = document.getElementById('absentCount');

    const fabUpload = document.getElementById('fabUpload');
    const modalUpload = document.getElementById('modalUpload');
    const closeModal = document.getElementById('closeModal');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');

    let pollTimer = null;

    // 颜色与标签（7 类行为）
    const CAT_COLORS = ['#1f6feb','#22c55e','#f59e0b','#ef4444','#8b5cf6','#14b8a6','#94a3b8'];
    const CAT_CN = ['注意听讲','低头','东张西望','传递物品','睡觉','举手','站立'];
    const DIST_KEYS = ['normal','raise','down','turn','sleep'];
    const DIST_LABELS = ['注意听讲','举手','低头','东张西望','睡觉'];

    // 简易图表占位渲染
    function drawLine(canvasId, points=[], color='#1f6feb', showAxes=false) {
      points = points.length? points : Array.from({length:24}, (_,i)=> Math.sin(i/3)*0.4 + 0.5 + Math.random()*0.2);
      const el = document.getElementById(canvasId); if (!el) return;
      if (window.echarts) {
        const chart = echarts.getInstanceByDom(el) || echarts.init(el);
        const len = points.length;
        chart.setOption({
          grid: {left: 40, right: 10, top: 24, bottom: 32},
          xAxis: {type: 'value', min: 0, max: 1, axisLine: {lineStyle:{color:'#294064'}}, axisLabel:{color:'#9fb2d9', margin:8}},
          yAxis: {type: 'value', min: 0, max: 1, axisLine:{lineStyle:{color:'#294064'}}, axisLabel:{color:'#9fb2d9', margin:8}},
          tooltip: {trigger: 'axis'},
          series: [{type: 'line', data: points.map((v,i)=> [len>1? i/(len-1): 0, Number(v)]), smooth: true, areaStyle: {}, lineStyle:{color: color}, itemStyle:{color: color} }]
        });
        return;
      }
      el.innerHTML = '';
      const canvas = document.createElement('canvas'); el.appendChild(canvas);
      const ctx = canvas.getContext('2d'); const w = canvas.width = el.clientWidth; const h = canvas.height = el.clientHeight;
      ctx.clearRect(0,0,w,h);
      const m = showAxes ? {l:32,r:10,t:18,b:34} : {l:0,r:0,t:0,b:0};
      const cw = Math.max(1, w - m.l - m.r); const ch = Math.max(1, h - m.t - m.b);
      const len = points.length; const step = len>1? cw/(len-1): cw;
      if (showAxes) {
        ctx.strokeStyle = '#294064'; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(m.l, h - m.b); ctx.lineTo(w - m.r, h - m.b);
        ctx.moveTo(m.l, m.t); ctx.lineTo(m.l, h - m.b);
        ctx.stroke();
        const yTicks = [0,0.25,0.5,0.75,1];
        ctx.fillStyle = '#9fb2d9'; ctx.font = '12px Inter, Arial';
        yTicks.forEach(t => {
          const y = m.t + (1 - t) * ch;
          ctx.strokeStyle = '#23375d'; ctx.beginPath(); ctx.moveTo(m.l, y); ctx.lineTo(w - m.r, y); ctx.stroke();
          ctx.fillText(String(t), m.l - 26, y + 4);
        });
        for (let i=0;i<len;i++) {
          const x = m.l + i * step;
          ctx.strokeStyle = '#23375d'; ctx.beginPath(); ctx.moveTo(x, h - m.b); ctx.lineTo(x, h - m.b - 4); ctx.stroke();
          if (i===0 || i===len-1 || i%4===0) { const t = len>1? (i/(len-1)).toFixed(2): '0.00'; ctx.fillText(t, x - 12, h - m.b + 14); }
        }
      }
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
      for (let i=0;i<len;i++) {
        const x = m.l + i * step; const y = m.t + (1 - points[i]) * ch;
        i? ctx.lineTo(x,y): ctx.moveTo(x,y);
      }
      ctx.stroke();
    }
    function drawPie(canvasId, values=[40,30,20,10,5], colorsOverride=null) {
      const colors = colorsOverride || CAT_COLORS;
      const el = document.getElementById(canvasId); if (!el) return;
      if (window.echarts) {
        const chart = echarts.getInstanceByDom(el) || echarts.init(el);
        chart.setOption({
          tooltip: {trigger: 'item'},
          legend: {bottom: 0, textStyle:{color:'#9fb2d9'}},
          color: colors,
          series: [{type: 'pie', radius: ['35%','60%'], label: {show:false}, labelLine: {show:false}, data: ['传递物品','东张西望','睡觉','低头'].map((n,i)=>({name:n, value: values[i]||0})) }]
        });
        return;
      }
      el.innerHTML = '';
      const canvas = document.createElement('canvas'); el.appendChild(canvas);
      const ctx = canvas.getContext('2d'); const r = Math.min(canvas.width, canvas.height)/2 - 6; const cx = canvas.width/2, cy = canvas.height/2;
      const total = values.reduce((a,b)=>a+b,0); let start=0;
      values.forEach((v,i)=>{ const ang = (v/total)*Math.PI*2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+ang); ctx.closePath(); ctx.fillStyle=colors[i%colors.length]; ctx.fill(); start+=ang; });
      const cardColor = getComputedStyle(document.documentElement).getPropertyValue('--card').trim() || '#111b33';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,Math.PI*2); ctx.fillStyle = cardColor; ctx.fill();
    }
    function renderLegendDiscipline() {
      const el = document.getElementById('disciplineLegend'); if (!el) return;
      const labels = ['传递物品','东张西望','睡觉','低头'];
      const colorIndexMap = [3,2,4,1];
      el.innerHTML = '';
      for (let i=0;i<labels.length;i++) {
        const item = document.createElement('div'); item.className = 'legend-item';
        const sw = document.createElement('div'); sw.className = 'legend-swatch'; sw.style.background = CAT_COLORS[colorIndexMap[i]];
        const txt = document.createElement('span'); txt.textContent = labels[i];
        item.appendChild(sw); item.appendChild(txt); el.appendChild(item);
      }
    }
    function renderLegendTrend() {}
    function renderLegendInteraction() {}
    function drawBars(containerId, values=[20,45,30,25,35], labels=CAT_CN) {
      if (window.echarts) {
        const el = document.getElementById(containerId); if (!el) return;
        const chart = echarts.getInstanceByDom(el) || echarts.init(el);
        chart.setOption({
          grid: {left: 40, right: 10, top: 10, bottom: 24},
          xAxis: {type: 'category', data: labels, axisLabel:{color:'#9fb2d9'}},
          yAxis: {type: 'value', axisLabel:{color:'#9fb2d9'}},
          tooltip: {trigger: 'axis'},
          series: [{type: 'bar', data: values.map((v,i)=>({value:Number(v), itemStyle:{color: CAT_COLORS[[0,5,1,2,4][i]]}})) }]
        });
        return;
      }
      const el = document.getElementById(containerId); if (!el) return; el.innerHTML=''; const max = Math.max(...values, 1);
      values.forEach((v,i)=>{ const d=document.createElement('div'); d.style.height = (v/max*100)+'%'; d.style.color = '#9fb2d9'; d.title = labels[i] + ': ' + v; d.textContent = labels[i]; el.appendChild(d); });
    }

    function drawGauge(canvasId, ratio=0.5) {
      // draw axes and line on created canvas
      ctx.clearRect(0,0,w,h);
      const r = Math.min(w,h)/2 - 12; const cx = w/2, cy = h*0.9; // 半圆仪表
      ctx.lineWidth = 10; ctx.strokeStyle = '#294064'; ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,0); ctx.stroke();
      // 进度
      const ang = Math.PI * ratio; ctx.strokeStyle = '#1f6feb'; ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI, Math.PI - ang); ctx.stroke();
      // 指针
      const nx = cx + r * Math.cos(Math.PI - ang); const ny = cy + r * Math.sin(Math.PI - ang);
      ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(nx,ny); ctx.stroke();
      // 文本
      ctx.fillStyle = '#e8eef9'; ctx.font = 'bold 16px Inter, Arial'; ctx.textAlign = 'center';
      ctx.fillText((ratio*100).toFixed(0) + '%', cx, cy- r - 6);
    }

    function drawStackedArea(canvasId, seriesMatrix=[[0.5]], colors=CAT_COLORS) {
      const el = document.getElementById(canvasId); if (!el) return;
      if (window.echarts) {
        const chart = echarts.getInstanceByDom(el) || echarts.init(el);
        const len = seriesMatrix[0]?.length || 0;
        const labels = ['注意听讲','举手','低头','东张西望','睡觉'];
        chart.setOption({
          grid: {left: 40, right: 10, top: 50, bottom: 32},
          xAxis: {type: 'value', min: 0, max: 1, axisLabel:{color:'#9fb2d9', margin:8}},
          yAxis: {type: 'value', min: 0, max: 1, axisLabel:{color:'#9fb2d9', margin:8}},
          legend: {top: 0, textStyle:{color:'#9fb2d9'}},
          color: colors,
          tooltip: {trigger: 'axis'},
          series: seriesMatrix.map((arr,idx)=> ({name: labels[idx] || ('S'+idx), type:'line', stack:'total', areaStyle:{}, data: arr.map((v,i)=> [len>1? i/(len-1): 0, Number(v)])}))
        });
        return;
      }
      el.innerHTML = '';
      const canvas = document.createElement('canvas'); el.appendChild(canvas);
      const ctx = canvas.getContext('2d'); const w = canvas.width = el.clientWidth; const h = canvas.height = el.clientHeight;
      ctx.clearRect(0,0,w,h);
      const n = seriesMatrix.length; const len = seriesMatrix[0]?.length || 0;
      const xStep = len>1? w/(len-1): w;
      let cumPrev = new Array(len).fill(0);
      for (let s=0; s<n; s++) {
        const series = seriesMatrix[s]; ctx.fillStyle = colors[s % colors.length]; ctx.globalAlpha = 0.35;
        ctx.beginPath();
        for (let i=0;i<len;i++) {
          const x = i * xStep; const y = h - (cumPrev[i] + series[i]) * h;
          i===0? ctx.moveTo(x,y): ctx.lineTo(x,y);
        }
        for (let i=len-1;i>=0;i--) {
          const x = i * xStep; const y = h - cumPrev[i] * h;
          ctx.lineTo(x,y);
        }
        ctx.closePath(); ctx.fill();
        for (let i=0;i<len;i++) cumPrev[i] += series[i];
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#294064'; ctx.strokeRect(0,0,w,h);
    }

    // 初始渲染占位（将由真实数据覆盖）
    drawBars('distBars', [20,35,18,12,10], DIST_LABELS);
    const TREND_COLORS = [CAT_COLORS[0], CAT_COLORS[5], CAT_COLORS[1], CAT_COLORS[2], CAT_COLORS[4]];
    drawStackedArea('stackedArea', [[0.5,0.6,0.55,0.58,0.62]], TREND_COLORS);
    drawLine('interactionLine', Array.from({length:24}, (_,i)=> 0.4 + Math.sin(i/6)*0.1), CAT_COLORS[5], true);
    drawPie('disciplinePie', [30,20,10,15], [CAT_COLORS[3], CAT_COLORS[2], CAT_COLORS[4], CAT_COLORS[1]]);

    // 上传交互
    fabUpload.onclick = () => { modalUpload.style.display = 'flex'; };
    closeModal.onclick = () => { modalUpload.style.display = 'none'; };

    function toFormData() {
      const fd = new FormData();
      fd.append('course_name', document.getElementById('courseName').value);
      fd.append('course_desc', document.getElementById('courseDesc').value);
      const students = document.getElementById('students').value.split('\n').filter(Boolean).map(n => ({ name: n.trim() }));
      fd.append('students', JSON.stringify(students));
      const file = document.getElementById('videoFile').files[0];
      if (file) fd.append('video', file);
      return fd;
    }

    function setProgress(pct, msg) { progressBar.style.width = (pct||0) + '%'; statusText.textContent = msg || ''; }

    async function startUpload() {
      uploadBtn.disabled = true; setProgress(0, '正在上传...');
      try {
        const res = await fetch('/api/courses/upload', { method: 'POST', body: toFormData() });
        const data = await res.json(); if (!data.job_id) throw new Error('创建任务失败');
        modalUpload.style.display = 'none'; pollStatus(data.job_id);
      } catch (e) { setProgress(0, '上传失败: ' + e.message); uploadBtn.disabled = false; }
    }

    async function pollStatus(jobId) {
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const s = await (await fetch('/api/jobs/' + jobId + '/status')).json(); setProgress(s.progress || 0, s.message || '');
          if (detectStatusEl) {
            detectStatusEl.textContent = s.status === 'completed' ? '分析成功' : (s.status === 'error' ? '分析失败' : '处理中');
          }
          if (s.status === 'completed' || s.status === 'error') {
            clearInterval(pollTimer);
            const r = await (await fetch('/api/jobs/' + jobId + '/result')).json();
            if (r.processed_video) { resultVideo.src = r.processed_video; }
            const stats = r.behavior_stats || {};
            const counts = {
              normal: (stats['Normal Listening']||0),
              down: (stats['Looking Down']||0),
              turn: (stats['Turning Around']||0),
              pass: (stats['Passing Objects']||0),
              sleep: (stats['Sleeping']||0),
              raise: (stats['Raising Hand']||0),
              stand: (stats['Standing']||0)
            };
            const totalFrames = Object.values(counts).reduce((a,b)=>a+b,0) || 1;
            const abnormal = counts.raise + counts.stand + counts.pass + counts.turn + counts.sleep + counts.down;
            // 更新检测状态信息
            if (stDown) stDown.textContent = counts.down;
            if (stSleep) stSleep.textContent = counts.sleep;
            if (stRaise) stRaise.textContent = counts.raise;

            // 签到与人数
            const list = r.attendance || [];
            const present = list.filter(i => i.status === 'Present').length;
            ovAttend.textContent = present;
            ovAbn.textContent = abnormal;
            attendanceBody.innerHTML = list.map(i => `<tr><td>${i.name}</td><td>${i.status}</td></tr>`).join('');
            const absent = list.filter(i => i.status !== 'Present');
            absentCount.textContent = absent.length + '人';
            absentBody.innerHTML = absent.map((i,idx)=> `<tr><td>${20230000+idx}</td><td>${i.name}</td><td>${i.status}</td></tr>`).join('');
            ovCourse.textContent = document.getElementById('courseName').value || '—'; ovTeacher.textContent = '—';
            infoCourse.textContent = ovCourse.textContent;
            infoDesc.textContent = document.getElementById('courseDesc').value || '—';
            infoTotal.textContent = String(list.length || 0);

            // 概览：出勤率、专注度、坏行为比例、举手次数
            const attendRate = list.length ? present / list.length : 0;
            ovAttendRate.textContent = (attendRate*100).toFixed(0) + '%';
            const weights = { normal: 2, raise: 2, stand: 0, down: 0.5, turn: -1, pass: -2, sleep: -5 };
            const attentionScoreRaw = (
              counts.normal * weights.normal + counts.raise * weights.raise + counts.stand * weights.stand +
              counts.down * weights.down + counts.turn * weights.turn + counts.pass * weights.pass + counts.sleep * weights.sleep
            ) / totalFrames;
            const attentionRatio = Math.max(0, Math.min(1, (attentionScoreRaw + 5) / 7)); // 映射到 0-1
            ovAttention.textContent = (attentionRatio*100).toFixed(0) + '%';
            const badRatio = Math.min(1, (counts.pass + counts.turn + counts.sleep) / totalFrames);
            ovBadRatio.textContent = (badRatio*100).toFixed(0) + '%';
            ovRaiseCount.textContent = String(counts.raise);

            // 行为分布：7 类柱状图
            const distVals = DIST_KEYS.map(k => ({
              normal: counts.normal,
              raise: counts.raise,
              down: counts.down,
              turn: counts.turn,
              sleep: counts.sleep
            }[k]));
            drawBars('distBars', distVals, DIST_LABELS);

            // 行为趋势分析：堆叠面积（按比例）
            const baseRatios = distVals.map(v => v / (totalFrames || 1));
            const mkSeries = (arr,len=24) => Array.from({length:len}, (_,i)=> arr[i % arr.length]);
            const seriesMatrix = baseRatios.map(ratio => mkSeries([ratio]));
            const TREND_COLORS = [CAT_COLORS[0], CAT_COLORS[5], CAT_COLORS[1], CAT_COLORS[2], CAT_COLORS[4]];
            drawStackedArea('stackedArea', seriesMatrix, TREND_COLORS);

            // 互动分析：举手+站立 比例折线
            const interactRatio = Math.min(1, (counts.raise + counts.stand) / totalFrames);
            drawLine('interactionLine', mkSeries([interactRatio]), CAT_COLORS[5], true);

            // 纪律分析：不良行为比例饼图（含看低头）
            drawPie('disciplinePie', [counts.pass, counts.turn, counts.sleep, counts.down], [CAT_COLORS[3], CAT_COLORS[2], CAT_COLORS[4], CAT_COLORS[1]]);
            renderLegendDiscipline();

            uploadBtn.disabled = false;
          }
        } catch (e) { /* 忽略短暂轮询错误 */ }
      }, 1500);
    }

    uploadBtn.addEventListener('click', startUpload);
  </script>
</body>
</html>
